  <!-- footer -->
  <g font-family="monospace" font-weight="700" letter-spacing="8">
    <text x="80" y="588" font-size="20" fill="#16181D">S. ABDI DZIKRY</text>
    <text x="330" y="588" font-size="20" fill="#A8823C">・</text>
    <text x="360" y="588" font-size="20" fill="#6E6A5C">SULTHANABDI.VERCEL.APP</text>
