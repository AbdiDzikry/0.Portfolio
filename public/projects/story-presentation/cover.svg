  <text x="100" y="376" font-family="monospace" font-weight="700" font-size="26" letter-spacing="4" fill="#6E6A5C">DI MASA DEPAN, KAMU INGIN DIKENAL SEBAGAI APA?</text>

  <!-- corner blossom -->
  <g transform="translate(1030 150)">
    <ellipse cx="0" cy="-24" rx="10" ry="16" fill="#C9413B"/>
    <ellipse cx="0" cy="-24" rx="10" ry="16" fill="#C9413B" transform="rotate(72)"/>
    <ellipse cx="0" cy="-24" rx="10" ry="16" fill="#C9413B" transform="rotate(144)"/>
    <ellipse cx="0" cy="-24" rx="10" ry="16" fill="#C9413B" transform="rotate(216)"/>
    <ellipse cx="0" cy="-24" rx="10" ry="16" fill="#C9413B" transform="rotate(288)"/>
    <circle r="9" fill="#A8823C"/>
  </g>
  <g transform="translate(960 210)">
