    <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#A8823C" transform="rotate(144)"/>
    <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#A8823C" transform="rotate(216)"/>
    <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#A8823C" transform="rotate(288)"/>
