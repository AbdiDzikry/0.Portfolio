<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- paper background -->
  <rect width="1200" height="675" fill="#F1EEE4"/>
  <rect x="40" y="40" width="1120" height="595" rx="28" fill="#FBF9F3" stroke="#E4DDCB" stroke-width="2"/>

  <!-- flower watermark -->
  <g transform="translate(120 620) scale(4.2)" opacity="0.05">
    <path d="M 0 -26 A 10 16 0 0 1 0 26" fill="none" stroke="#C9413B" stroke-width="5"/>
  </g>
  <g transform="translate(170 640)" opacity="0.05">
    <g transform="translate(0 0)">
      <ellipse cx="0" cy="-22" rx="9" ry="15" fill="#C9413B"/>
      <ellipse cx="0" cy="-22" rx="9" ry="15" fill="#C9413B" transform="rotate(72)"/>
      <ellipse cx="0" cy="-22" rx="9" ry="15" fill="#C9413B" transform="rotate(144)"/>
