  </g>

  <!-- heading -->
  <g font-family="monospace" font-weight="900">
    <text x="80" y="108" font-size="34" letter-spacing="14" fill="#A8823C">IDENTITY &amp; PURPOSE</text>
  </g>

  <!-- title -->
  <g font-family="sans-serif" font-weight="900">
